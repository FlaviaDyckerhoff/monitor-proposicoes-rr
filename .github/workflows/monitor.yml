name: Monitor Proposições RR

env:
  TZ: America/Sao_Paulo

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem enviar email nem atualizar estado (1=sim)'
        required: false
        default: ''

concurrency:
  group: monitor-proposicoes-rr
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Corrigir permissões do workspace
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
          test -w .git || { echo "Workspace sem permissão de escrita"; exit 1; }

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Executar monitor
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          CONTROLE03_API_USER: ${{ secrets.CONTROLE03_API_USER }}
          CONTROLE03_API_PASS: ${{ secrets.CONTROLE03_API_PASS }}
          CONTROLE03_STATE_URL: ${{ secrets.CONTROLE03_STATE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node monitor.js

      - name: Salvar estado atualizado no repositório
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f estado.json ]; then
            echo '{"proposicoes_vistas":[],"ultima_execucao":""}' > estado.json
          fi
          git add estado.json
          git diff --staged --quiet || git commit -m "chore: atualiza estado [skip ci]"
          git pull --rebase origin main
          git push
